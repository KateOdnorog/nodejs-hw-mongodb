tags:
  - Auth
summary: Register user
operationId: registerUser
description: 'Register user with payload'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: 'User`s name'
            type: string
            example: 'John Doe'
          email:
            description: 'User`s email'
            type: string
            example: petryk.pyatochkin@gmail.com
          password:
            description: 'User`s password'
            type: string
            format: password
responses:
  '201':
    description: 'User registered successfully'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              required:
                - name
                - email
                - _id
                - createdAt
                - updatedAt
              properties:
                name:
                  type: string
                  example: 'John Doe'
                email:
                  type: string
                  example: petryk.pyatochkin@gmail.com
                _id:
                  type: string
                  example: '68507c4e49138e8aa4b2694e'
                createdAt:
                  type: string
                  format: date-time
                  example: '2025-06-24T17:03:41.482+00:00'
                updatedAt:
                  type: string
                  format: date-time
                  example: '2025-06-24T17:03:41.482+00:00'
  '409':
    $ref: '../../components/responses/409.yaml'
