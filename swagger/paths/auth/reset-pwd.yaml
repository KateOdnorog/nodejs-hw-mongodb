tags:
  - Auth
summary: Reset password
operationId: resetUserPassword
description: 'Reset user password with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            description: 'Reset password token'
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2ODUwNWVhMWMwMTJhZjUyY2MwMzI2ZGIiLCJlbWFpbCI6ImthdHlhLm9kbm9yb2dAZ21haWwuY29tIiwiaWF0IjoxNzUwODc4NzQ1LCJleHAiOjE3NTA4Nzk2NDV9.wKDe8zBog-sZ5vKLQCICllz22I4PiAoZXt0-fSUD2Vs'
          password:
            description: 'User`s password'
            type: string
            format: password
responses:
  '200':
    description: 'User password reset successfully'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Password has been successfully reset.'
  '401':
    $ref: '../../components/responses/401.yaml'
